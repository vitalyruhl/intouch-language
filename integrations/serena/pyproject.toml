[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "intouch-language-serena"
version = "0.0.0"
description = "Serena adapter for the InTouch QuickScript language server"
requires-python = ">=3.11"
dependencies = ["serena-agent"]

[project.entry-points."serena.language_servers"]
quickscript = "intouch_language_serena.adapter:register"
