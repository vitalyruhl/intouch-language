name: Unit-Testing
on:
  push:
    branches: [bugfixing, main]
  pull_request:
    branches: [main]
 
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        # Secure test dependencies require Node 20 or later; test supported LTS releases.
        node-version: [22.x, 24.x]
    runs-on: ${{ matrix.os }} 

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm install
    - run: xvfb-run -a npm test
      if: runner.os == 'Linux'
    - run: npm test
      if: runner.os != 'Linux'
